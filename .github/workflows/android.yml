# Builds the Android app (APK) on every push.
# With the ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD repository secrets it signs with
# your key and publishes the APK as the latest release:
#   https://github.com/<owner>/<repo>/releases/latest/download/gym-tracker.apk
# Without them it signs with a throwaway key, only to check the build works (test build, don't install).
name: Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04 # pinned: the Android SDK comes preinstalled on this image
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the build number is the commit count, same as the website's

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install and copy the web app into the Android project
        run: |
          npm ci
          BUILD_NUMBER=$(git rev-list --count HEAD) npm run build
          npx cap sync android

      - name: Signing key (yours)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/release.p12
          printf 'storeFile=release.p12\nstorePassword=%s\nkeyAlias=gymtracker\n' "$KEYSTORE_PASSWORD" > android/keystore.properties

      - name: Signing key (throwaway, test build only)
        if: env.HAS_KEY != 'true'
        run: |
          node scripts/make-signing-key.js "$RUNNER_TEMP/testkey" > /dev/null
          cp "$RUNNER_TEMP/testkey/release.p12" android/release.p12
          printf 'storeFile=release.p12\nstorePassword=%s\nkeyAlias=gymtracker\n' "$(cat "$RUNNER_TEMP/testkey/ANDROID_KEYSTORE_PASSWORD.txt")" > android/keystore.properties

      - name: Check the signing key
        run: |
          PW=$(sed -n 's/^storePassword=//p' android/keystore.properties)
          keytool -list -keystore android/release.p12 -storetype PKCS12 -storepass "$PW" -alias gymtracker

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace > build.log 2>&1; then
            tail -n 150 build.log
            # Surface the key lines as an annotation so the failure reason is visible on the run page.
            node -e 'const lines = require("fs").readFileSync("build.log", "utf8").split("\n");
              const key = lines.filter((l) => /error:|What went wrong|FAILURE|Could not|Execution failed|> /.test(l)).slice(0, 40);
              const msg = (key.length ? key : lines.slice(-40)).join("\n");
              console.log("::error title=Gradle build failed::" + msg.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A"));'
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../gym-tracker.apk
          ls -l ../gym-tracker.apk

      - name: Publish the APK (latest release)
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest gym-tracker.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Gym Tracker for Android (build ${{ github.run_number }})" \
            --notes "Install: open this page on your Android phone, tap gym-tracker.apk, then Install. Updates install over the old app and keep your data."
          echo "### ✅ APK published" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/gym-tracker.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the test build
        if: env.HAS_KEY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-build-do-not-install
          path: gym-tracker.apk
          retention-days: 3

      - name: Explain the test build
        if: env.HAS_KEY != 'true'
        run: |
          echo "### ⚠️ Test build only" >> "$GITHUB_STEP_SUMMARY"
          echo "The build works, but no signing key is set up, so nothing was published." >> "$GITHUB_STEP_SUMMARY"
          echo "Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets (see ANDROID.md), then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
